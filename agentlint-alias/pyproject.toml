[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentlint"
version = "0.6.0"
description = "Alias package — installs instruction-lint. Run: pip install instruction-lint"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "agentlint", email = "hello@agentlint.dev" },
]
keywords = ["agentlint", "instruction-lint", "lint", "ai", "copilot", "cursor", "windsurf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "instruction-lint>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/Mr-afroverse/agentlint"
Repository = "https://github.com/Mr-afroverse/agentlint"

[tool.hatch.build.targets.wheel]
packages = ["agentlint_redirect"]

name: agentlint
description: Audit AI coding assistant instruction files for drift, broken references, and structural issues.
author: agentlint

inputs:
  path:
    description: Directory to scan (default: repo root)
    required: false
    default: "."
  format:
    description: Output format — "text", "json", "sarif", "badge", or "html"
    required: false
    default: "text"
  adapter:
    description: Force adapter — "copilot", "cursor", "windsurf", "aider", "continue", "claudecode", "gemini", or "auto"
    required: false
    default: "auto"
  fail-on-warnings:
    description: Exit 1 when warnings are present (default false)
    required: false
    default: "false"
  version:
    description: instruction-lint version to install (pin for reproducible CI)
    required: false
    default: "0.6.1"
  config:
    description: Path to .agentlint.yml config file (optional)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install agentlint
      shell: bash
      run: pip install instruction-lint==${{ inputs.version }}

    - name: Run agentlint
      shell: bash
      run: |
        ARGS="${{ inputs.path }} --format ${{ inputs.format }} --adapter ${{ inputs.adapter }}"
        if [ "${{ inputs.fail-on-warnings }}" = "true" ]; then
          ARGS="$ARGS --fail-on-warnings"
        fi
        if [ -n "${{ inputs.config }}" ]; then
          ARGS="$ARGS --config ${{ inputs.config }}"
        fi
        agentlint $ARGS

# agentlint self-lint config
# Extends zero-config checks (AL-D01, AL-D02, AL-F01, AL-N01, AL-T01, AL-P*)
# to the project's own documentation files.

extra_paths:
  - README.md
  - CONTRIBUTING.md
  - CHANGELOG.md
  - .github/agents/stress-test.agent.md
  - .github/agents/release-check.agent.md
  - .github/agents/coding.agent.md
  - .github/agents/orchestrator.agent.md


ignore_paths:
  - path: "CHANGELOG.md"
    checks: ["dead-anchors"]
    reason: "Contains illustrative syntax examples that trigger AL-F02 false positives"
  - path: ".github/agents/"
    checks: ["file-references", "dead-anchors", "inverse-claims"]
    reason: "Agent scenario files contain example paths and conditional language, not real file references"
